name: emergencyai
description: EmergencyAI — AI-powered emergency assistant (Flutter client).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # 3.27+ for Color.withValues (replaces the deprecated withOpacity)
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.7
  # Networking
  dio: ^5.7.0
  # Secure token storage
  flutter_secure_storage: ^9.2.2
  # WebSockets for live incidents
  socket_io_client: ^2.0.3+1
  # QR medical card
  qr_flutter: ^4.1.0
  # Live GPS location
  geolocator: ^13.0.1
  # Hands-free voice coaching (browser SpeechSynthesis on web)
  flutter_tts: ^4.2.0
  # Audible metronome beat for CPR cadence
  audioplayers: ^6.1.0
  # Placing the emergency phone call (tel:)
  url_launcher: ^6.3.0
  # Keep the screen awake during coaching (screen sleep mid-CPR = coach dies)
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
